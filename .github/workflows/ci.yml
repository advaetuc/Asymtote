name: Quality and API contract gates

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned Python package manager
        run: python -m pip install uv==0.12.19
      - name: Install locked dependencies
        run: |
          uv sync --locked
          npm ci
      - name: Python lint, typing, and tests
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest
      - name: Frontend lint, typing, tests, and production build
        run: npm run check
        env:
          AUGMENTR_LOCAL_API_PROXY: '1'
      - name: Runtime dependency and bundle budget
        run: npm run audit:runtime
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
      - name: Generated OpenAPI and TypeScript contracts must be current
        run: npm run contracts:check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production desktop, mobile, accessibility, and CSP gates
        run: npm run test:e2e
        env:
          E2E_PRODUCTION: '1'
          E2E_REUSE_SERVERS: '0'
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
