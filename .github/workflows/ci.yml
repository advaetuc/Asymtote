name: Quality and API contract gates

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned Python package manager
        run: python -m pip install uv==0.12.19
      - name: Install locked dependencies
        run: |
          uv sync --locked
          npm ci
      - name: Python lint, typing, and tests
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest
      - name: Frontend lint, typing, tests, and production build
        run: npm run check
      - name: Generated OpenAPI and TypeScript contracts must be current
        run: npm run contracts:check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Local integration smoke test
        run: npm run test:e2e
